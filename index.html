<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <title>YKS Takip</title>
  <meta name="description" content="Kişisel YKS çalışma takip uygulaması. İnternetsiz çalışır, veriler telefonda kalır.">
  <meta name="theme-color" content="#0b0d12">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YKS Takip">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="author" content="LevioraLabs">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div style="display: none; opacity: 0; pointer-events: none;" aria-hidden="true" data-author="LevioraLabs">
    Crafted by LevioraLabs - 2026
  </div>
  <noscript>
    <p style="padding:24px;color:#e7ebf3;background:#0b0d12">
      Bu uygulama çalışmak için JavaScript'e ihtiyaç duyuyor. Tarayıcı ayarlarından JavaScript'i aç.
    </p>
  </noscript>

  <!-- Açılış perdesi: veriler okunana kadar görünür, sonra kaldırılır. -->
  <div class="boot" id="boot">
    <div class="boot-mark" aria-hidden="true"></div>
    <p class="boot-text">Yükleniyor</p>
  </div>

  <!-- Veritabanı hiç açılamazsa gösterilen dürüst hata ekranı. -->
  <div class="fatal" id="fatal" hidden>
    <h1>Uygulama açılamadı</h1>
    <p id="fatal-message"></p>
    <button class="btn btn-primary" id="fatal-retry" type="button">Yeniden dene</button>
  </div>

  <div class="app" id="app" hidden>
    <main class="screens" id="screens">
      <section class="screen" id="screen-today" data-screen="today" aria-label="Bugün"></section>
      <section class="screen" id="screen-stats" data-screen="stats" aria-label="İstatistik" hidden></section>
      <section class="screen" id="screen-tasks" data-screen="tasks" aria-label="Görevler" hidden></section>
      <section class="screen" id="screen-settings" data-screen="settings" aria-label="Ayarlar" hidden></section>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Ana gezinme">
      <button class="tab is-active" type="button" data-tab="today" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></svg>
        <span>Bugün</span>
      </button>
      <button class="tab" type="button" data-tab="stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20h17"/><path d="M7 20v-5.5"/><path d="M12 20V8"/><path d="M17 20v-9"/></svg>
        <span>İstatistik</span>
      </button>
      <button class="tab" type="button" data-tab="tasks">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6.5h10M10 12h10M10 17.5h6"/><path d="M3.6 6.3l1.5 1.5 2.4-2.6"/><path d="M3.6 11.8l1.5 1.5 2.4-2.6"/></svg>
        <span>Görevler</span>
        <span class="tab-badge" id="tab-badge" hidden>0</span>
      </button>
      <button class="tab" type="button" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.3"/><circle cx="15" cy="12" r="2.3"/><circle cx="8" cy="17" r="2.3"/></svg>
        <span>Ayarlar</span>
      </button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div class="snack-root" id="snack-root" role="status" aria-live="polite"></div>

  <script>
    // Modul yuklenme hatasini yakala (import 404, sozdizimi hatasi vb.)
    window.addEventListener('error', function(e) {
      var fatal = document.getElementById('fatal');
      var msg = document.getElementById('fatal-message');
      var boot = document.getElementById('boot');
      if (fatal && msg && !fatal._shown) {
        fatal._shown = true;
        if (boot) boot.remove();
        msg.textContent = (e.message || '') + ' — ' + (e.filename || '') + ':' + (e.lineno || '');
        fatal.hidden = false;
        document.getElementById('fatal-retry').addEventListener('click', function() { location.reload(); });
      }
    });
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
